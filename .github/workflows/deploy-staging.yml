name: Deploy EMEC Backend Staging

on:
  push:
    branches:
      - main

jobs:
  deploy-staging:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Debug repository structure
        run: |
          pwd
          ls -la
          find . -maxdepth 3 \( -name artisan -o -name composer.json \)

      - name: Upload backend to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "emec-back/*"
          target: "/home/projects/emec-projects/emec-siteweb"
          strip_components: 1
          overwrite: true

      - name: Run Laravel deployment commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/projects/emec-projects/emec-siteweb

            if [ ! -f artisan ]; then
              echo "artisan introuvable. Verifie le dossier source GitHub et strip_components."
              ls -la
              exit 1
            fi

            if [ ! -f composer.json ]; then
              echo "composer.json introuvable."
              ls -la
              exit 1
            fi

            if [ ! -f .env ]; then
              echo ".env manquant sur le serveur."
              exit 1
            fi

            composer install --no-dev --optimize-autoloader

            php artisan migrate --force
            php artisan storage:link || true

            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            chmod -R ug+rw storage bootstrap/cache
