name: Deploy EMEC Backend Staging

on:
  push:
    branches:
      - main

jobs:
  deploy-staging:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Debug repository structure
        run: |
          pwd
          ls -la
          find . -maxdepth 2 \( -name artisan -o -name composer.json \)

      - name: Upload backend to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "."
          target: "/home/projects/emec-projects/emec-siteweb"
          overwrite: true
          rm: false
          exclude: |
            .git
            .github
            .env
            vendor
            node_modules
            storage/logs/*
            storage/api-docs/*
            emec-back-github-actions
            emec-back-github-actions.pub

      - name: Run Laravel deployment commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/projects/emec-projects/emec-siteweb

            if [ ! -f artisan ]; then
              echo "artisan introuvable apres copie."
              echo "Contenu du dossier:"
              ls -la
              echo "Recherche artisan:"
              find . -maxdepth 3 -name artisan
              exit 1
            fi

            if [ ! -f composer.json ]; then
              echo "composer.json introuvable apres copie."
              ls -la
              exit 1
            fi

            if [ ! -f .env ]; then
              echo ".env manquant sur le serveur."
              exit 1
            fi

            composer install --no-dev --optimize-autoloader

            php artisan migrate --force
            php artisan storage:link || true

            php artisan optimize:clear
            php artisan l5-swagger:generate
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            mkdir -p storage/logs bootstrap/cache
            chmod -R 775 storage bootstrap/cache
