name: Deploy EMEC Backend Production

on:
  push:
    branches:
      - prod

jobs:
  deploy-production:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Prepare deployment package
        run: |
          rm -rf deploy-package
          mkdir -p deploy-package
          rsync -a \
            --exclude='deploy-package' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='vendor' \
            --exclude='node_modules' \
            --exclude='storage/logs/*' \
            --exclude='storage/api-docs/*' \
            --exclude='emec-back-github-actions' \
            --exclude='emec-back-github-actions.pub' \
            ./ deploy-package/

      - name: Upload backend to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "deploy-package/*"
          target: "/home/projects/emec-projects/emec-siteweb-prod"
          strip_components: 1
          overwrite: true
          rm: false

      - name: Run Laravel production commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/projects/emec-projects/emec-siteweb-prod

            if [ ! -f artisan ]; then
              echo "artisan introuvable apres copie."
              ls -la
              exit 1
            fi

            if [ ! -f .env ]; then
              echo ".env production manquant sur le serveur."
              exit 1
            fi

            composer install --no-dev --optimize-autoloader

            php artisan migrate --force
            php artisan storage:link || true

            php artisan optimize:clear
            php artisan l5-swagger:generate
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            mkdir -p storage/logs storage/framework/cache/data storage/framework/sessions storage/framework/views bootstrap/cache
            chmod 775 storage storage/app storage/framework storage/framework/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache || true
            find bootstrap/cache storage/logs -type f -user deploy -exec chmod 664 {} \; || true
